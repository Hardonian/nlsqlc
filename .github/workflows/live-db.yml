name: live-database-matrix
on: [push, pull_request]
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: nlsqlc
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d nlsqlc"
          --health-interval=10s --health-timeout=5s --health-retries=5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: nlsqlc
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg[binary] duckdb mysql-connector-python
      - run: cmake -S . -B build-live -DNLSQL_BUILD_TESTS=OFF -DNLSQL_BUILD_CLI=OFF
      - run: cmake --build build-live --parallel
      - name: Execute configured live matrix
        env:
          NLSQL_LIBRARY: ${{ github.workspace }}/build-live/libnlsql.so
          NLSQL_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/nlsqlc
          NLSQL_DUCKDB_URL: ':memory:'
          NLSQL_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306/nlsqlc
        run: python tools/live-db-matrix.py
  sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'Nlsqlc-Strong!Passw0rd'
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          python -m pip install pyodbc
      - name: Execute SQL Server probe
        env:
          NLSQL_SQLSERVER_URL: 'DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=Nlsqlc-Strong!Passw0rd;TrustServerCertificate=yes'
        run: python tools/live-db-matrix.py