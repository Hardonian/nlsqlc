name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cmake -S . -B build -DNLSQL_BUILD_TESTS=ON -DNLSQL_BUILD_CLI=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. -Iinclude tests/test_cpp_binding.cpp build/libnlsql.so -Wl,-rpath,"$PWD/build" -o /tmp/nlsqlc-cpp-binding-test && /tmp/nlsqlc-cpp-binding-test
      - run: NLSQL_LIBRARY="$PWD/build/libnlsql.so" python3 tests/test_sqlite_integration.py
      - run: make clean && make all && make test
      - name: Run ThreadSanitizer tests
        run: cmake -S . -B build-tsan -DNLSQL_BUILD_TESTS=ON -DNLSQL_BUILD_CLI=OFF -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -g' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread' && cmake --build build-tsan --parallel && TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-tsan --output-on-failure
      - name: Run Clang fuzz target
        run: |
          CC=clang cmake -S . -B build-fuzz -DNLSQL_BUILD_TESTS=OFF -DNLSQL_BUILD_CLI=OFF -DNLSQL_BUILD_FUZZ=ON
          cmake --build build-fuzz --target nlsql-fuzz
          build-fuzz/nlsql-fuzz -runs=250 fuzz-corpus

      - run: tools/check-release-consistency.sh
      - name: Run Meson matrix lane
        run: |
          python3 -m pip install --user meson
          meson setup build-meson
          meson compile -C build-meson
          meson test -C build-meson --print-errorlogs
      - name: Run Python property and importer tests
        run: |
          python3 -m pip install --user pytest hypothesis
          pytest -q tests/test_importer.py tests/test_properties.py
      - run: tools/check-abi-compat.sh
      - run: python3 tools/check-release-evidence.py
      - name: Run release readiness gate
        run: SOURCE_DATE_EPOCH=1700000000 tools/release.sh 0.1.2 && tools/verify-release.sh 0.1.2
      - name: Install and test CMake package
        run: |
          cmake -S . -B build-install -DNLSQL_BUILD_TESTS=OFF -DNLSQL_BUILD_CLI=OFF
          cmake --build build-install --parallel
          cmake --install build-install --prefix "$RUNNER_TEMP/nlsqlc"
          printf '#include <nlsql/nlsql.h>\nint main(void){return nlsql_abi_version()==NLSQL_ABI_VERSION?0:1;}\n' > "$RUNNER_TEMP/consumer.c"
          cc -I"$RUNNER_TEMP/nlsqlc/include" "$RUNNER_TEMP/consumer.c" "$RUNNER_TEMP/nlsqlc/lib/libnlsql.a" -o "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer"
          PKG_CONFIG_PATH="$RUNNER_TEMP/nlsqlc/lib/pkgconfig" pkg-config --exists nlsqlc
  memory-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run MemorySanitizer tests
        run: |
          CC=clang cmake -S . -B build-msan -DNLSQL_BUILD_TESTS=ON -DNLSQL_BUILD_CLI=OFF -DCMAKE_C_FLAGS='-fsanitize=memory -fno-omit-frame-pointer -g' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=memory'
          cmake --build build-msan --parallel
          MSAN_OPTIONS=halt_on_error=1:exit_code=86 ctest --test-dir build-msan --output-on-failure
