[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlsqlc"
version = "0.1.2"
description = "Deterministic Multi-Tenant Query IR Compiler and Gateway Microservice"
readme = "README.md"
authors = [{ name = "Hardonian Team", email = "oss@hardonian.org" }]
license = { text = "Apache-2.0" }
keywords = ["sql", "compiler", "multi-tenant", "ai-agent", "security", "llm", "query-ir"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
]
requires-python = ">=3.8"

[project.scripts]
nlsql = "nlsql:main"

[tool.setuptools.package-dir]
"" = "bindings/python"

[tool.setuptools.packages.find]
where = ["bindings/python"]
