version: '3.8'

services:
  nlsqlc-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlsqlc-gateway
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
